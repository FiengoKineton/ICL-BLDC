# configs/train/baseline.yaml
train:
  epochs: 10000
  eval_interval: 10
  eval_iters: 10
  patience: 0
  grad_clip: null
  mixed_precision: "off"
loss:
  components:
    mse: { weight: 1.0 }
    smoothness: { weight: 0.0, diff_order: 1 }
optim:
  name: "adamw"
  lr: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  scheduler:
    name: "warmup_cosine"
    warmup_steps: 5000
    max_steps: 10000
    min_lr_scale: 0.1
