# configs/base.yaml

experiment:
  name: "temp"
  mode: "single"                                   # "single" or "sweep"
  output_root: "runs"                               # out directory for single run
  output_sweep: "sweeps_3"                          # out directory for sweeps
  seed: 123                                         # before: 42
  resources: "resources.csv"

data:
  project_root_marker: "Sweep_Speed_Estm"           # used to split cwd
  data_subdir: "data"
  seq_len: 10
  nx: 4
  nu: 5
  ny: 1

  folders:
    - "simulated/50_percent_low_speed"
  train__folders: 
    - "simulated/50_percent_low_speed"
  val__folders: 
    - "simulated/50_percent_low_speed"
  test__folders: 
    - "true/CL_experiments_double_sensor/inertia07_ki-0.0061-kp-11.8427"
  
  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1
  split_seed: 42

model:
  n_layer: 8
  n_head: 8                                         # 4 as default | sottomultiple di embd
  n_embd: 32                                        # 16 as default
  dropout: 0.05                                     # 0.0 as default | try!
  bias: false
  activation_function: "gelu"                       # "gelu" as default | "relu", "silu"

training:
  batch_size: 64                                    # 128 as default 
  max_iters: 10000
  lr: 1.0e-5
  warmup_iters: 5000
  weight_decay: 0.0
  eval_interval: 50
  eval_iters: 1
  patience: 1000
  fixed_lr: false        
  smoothness: true                                  # False as default
  R: 0.5                                            # regularization weight | to tune
  regression_mode: "time_last"                      # "time_last" as default | "time_full", "one_step"
  loss: "TimeWeightedMSE"                           # "MSE" as default | "TimeWeightedMSE"
  loss_mode: "exp"                                  # for TimeWeightedMSE | "linear", "exp"

scheduled_sampling:
  sched_enabled: true
  sched_mode: "stochastic"                          # "stochastic" or "soft"
  p0: 1.0                                           # initial teacher prob
  decay_epochs: 3000                                # epochs to decay to 0
  p_min: 0.0                                        # floor (usually 0)

simulations:
  dt: 0.01                                          # time step of the data
  fs: 100                                           # sampling frequency of the data
  downsample_factor: 10                             # downsample factor for speed estimation

compute:
  threads: 16
  no_cuda: false
  cuda_device: "cuda:0"
  compile: false

logging:
  checkpoint_stem: "test"
  init_from: "scratch"                              # scratch | resume | pretrained
  model_dir: "out"                                  # not really needed if you use run-specific dirs

plot:
  output_subdir: "plots"                            # relative to run dir / sweep dir
  show: false
  print: true
  logy: true
  ma: 1
  dpi: 160
  export_csv: true
  fmt: "pdf"
  min_T: 1000                                       # 0 if you want to start from t=0
  max_T: 501                                        # None is you want to plot the entire lenght


sweep:
  type: "grid"                                     # "grid", "random", "optuna", "successive_halving"
  path: "sweep_results.csv"
  n_trials: 50
  seed: 123

  pruning: false                                  # enable pruning of bad runs (only for optuna sweeps)     
  eta: 3                                          # keep 1/3 each round

  budgets: [5, 15, 50]                            # epochs per round
  budget_key: "training.max_epochs"


  params:
    n_layer:              [4, 8]                      # already tried              
    n_head:               [2, 4, 8]                   # already tried
    n_embd:               [16, 32]                    # already tried
    lr:                   [1.0e-4, 5.0e-5, 1.0e-5]    # already tried
    batch_size:           [64, 128]                   # already tried
    # n_layer8_n_head8_n_embd32_batch_size64,8,8,32,64,0.0006299590750131756,0d 10h 32m 31s,37951
    R:                    [0.1, 0.5, 1.0]
    dropout:              [0.0, 0.1, 0.2]
    patience:             [2000, 10000]
    bias:                 [true, false]
    activation_function:  ["gelu", "silu"]
    regression_mode:      ["time_last", "time_full"]
    sched_mode:           ["stochastic", "soft"]
    sched_enabled:        [true, false]

  distributions:     # continuous (sampled)
    lr:
      type: loguniform
      low: 1e-5
      high: 3e-3

    weight_decay:
      type: loguniform
      low: 1e-6
      high: 1e-2

    dropout:
      type: uniform
      low: 0.0
      high: 0.3